apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: iot-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      enableServiceLinks: false
      containers:
        - name: dashboard
          image: iot-monitoring-app:local
          imagePullPolicy: IfNotPresent
          command: ["streamlit"]
          args:
            - run
            - dashboard/app.py
            - --server.address=0.0.0.0
            - --server.port=8501
          envFrom:
            - secretRef:
                name: postgres-secret
          ports:
            - name: http
              containerPort: 8501
          startupProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: iot-monitoring
spec:
  selector:
    app: dashboard
  ports:
    - name: http
      port: 8501
      targetPort: http
