apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: iot-monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:18
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d/001-init.sql
              subPath: 001-init.sql
              readOnly: true
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "iot", "-d", "iot_monitoring"]
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "iot", "-d", "iot_monitoring"]
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "iot", "-d", "iot_monitoring"]
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init-script
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: iot-monitoring
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
