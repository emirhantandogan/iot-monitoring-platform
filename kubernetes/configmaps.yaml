apiVersion: v1
kind: ConfigMap
metadata:
  name: iot-config
  namespace: iot-monitoring
data:
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_TELEMETRY_TOPIC: telemetry.raw
  KAFKA_STORAGE_GROUP_ID: storage-consumer
  KAFKA_CONSUMER_BATCH_SIZE: "100"
  KAFKA_CONSUMER_BATCH_WAIT_MS: "100"
  INGESTION_URL: http://ingestion:8000
  LOAD_TEST_RESULTS_DIR: /app/results
  STORAGE_METRICS_URL: http://storage-consumer:9100/metrics
  STORAGE_METRICS_PORT: "9100"
  PIPELINE_SAMPLE_INTERVAL_SECONDS: "1"
  PIPELINE_DRAIN_TIMEOUT_SECONDS: "60"
  KUBERNETES_API_URL: https://kubernetes.default.svc
  KUBERNETES_NAMESPACE: iot-monitoring
  KUBERNETES_METRICS_URL: https://kubernetes.default.svc/apis/metrics.k8s.io/v1beta1/namespaces/iot-monitoring/pods
  POSTGRES_POD_NAME_PREFIX: postgres-
  STORAGE_POD_LABEL_SELECTOR: app=storage-consumer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: iot-monitoring
data:
  001-init.sql: |
    CREATE TABLE IF NOT EXISTS telemetry (
        id BIGSERIAL PRIMARY KEY,
        device_id VARCHAR(100) NOT NULL,
        temperature DOUBLE PRECISION NOT NULL,
        humidity DOUBLE PRECISION NOT NULL,
        recorded_at TIMESTAMPTZ NOT NULL,
        ingested_at TIMESTAMPTZ NOT NULL,
        received_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );
