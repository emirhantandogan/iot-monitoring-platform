apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  namespace: iot-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestion
  template:
    metadata:
      labels:
        app: ingestion
    spec:
      enableServiceLinks: false
      containers:
        - name: ingestion
          image: iot-monitoring-app:local
          imagePullPolicy: IfNotPresent
          command: ["uvicorn"]
          args:
            - services.telemetry_ingestion.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          envFrom:
            - configMapRef:
                name: iot-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion
  namespace: iot-monitoring
spec:
  selector:
    app: ingestion
  ports:
    - name: http
      port: 8000
      targetPort: http
