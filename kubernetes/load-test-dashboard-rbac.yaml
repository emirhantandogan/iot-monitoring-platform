apiVersion: v1
kind: ServiceAccount
metadata:
  name: load-test-dashboard
  namespace: iot-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: load-test-dashboard-pod-metrics
  namespace: iot-monitoring
rules:
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods", "pods/proxy"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: load-test-dashboard-pod-metrics
  namespace: iot-monitoring
subjects:
  - kind: ServiceAccount
    name: load-test-dashboard
    namespace: iot-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: load-test-dashboard-pod-metrics
