[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-monitoring-platform"
version = "0.1.0"
description = "A small IoT platform for learning Kafka, PostgreSQL, and scaling."
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.12,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.2,<4",
    "prometheus-client>=0.22,<1",
    "pydantic>=2.9,<3",
    "streamlit>=1.49,<2",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.setuptools.packages.find]
include = ["dashboard*", "shared*", "services*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
