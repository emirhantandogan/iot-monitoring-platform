services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: iot
      POSTGRES_PASSWORD: iot
      POSTGRES_DB: iot_monitoring
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot -d iot_monitoring"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s

  ingestion:
    build:
      context: .
      target: app
    image: iot-monitoring-app:local
    command: ["uvicorn", "services.telemetry_ingestion.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TELEMETRY_TOPIC: telemetry.raw
    ports:
      - "8000:8000"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  storage-consumer:
    image: iot-monitoring-app:local
    command: ["python", "-m", "services.storage_consumer.main"]
    restart: on-failure
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TELEMETRY_TOPIC: telemetry.raw
      KAFKA_STORAGE_GROUP_ID: storage-consumer
      KAFKA_CONSUMER_BATCH_SIZE: "100"
      KAFKA_CONSUMER_BATCH_WAIT_MS: "100"
      POSTGRES_DSN: postgresql://iot:iot@postgres:5432/iot_monitoring
      STORAGE_METRICS_PORT: "9100"
    expose:
      - "9100"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  dashboard:
    image: iot-monitoring-app:local
    command: ["streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      POSTGRES_DSN: postgresql://iot:iot@postgres:5432/iot_monitoring
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  load-test-dashboard:
    image: iot-monitoring-app:local
    command: ["streamlit", "run", "dashboard/load_tests.py", "--server.address=0.0.0.0", "--server.port=8502"]
    environment:
      INGESTION_URL: http://ingestion:8000
      LOAD_TEST_RESULTS_DIR: /app/results
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TELEMETRY_TOPIC: telemetry.raw
      KAFKA_STORAGE_GROUP_ID: storage-consumer
      POSTGRES_DSN: postgresql://iot:iot@postgres:5432/iot_monitoring
      STORAGE_METRICS_URL: http://storage-consumer:9100/metrics
      PIPELINE_SAMPLE_INTERVAL_SECONDS: "1"
      PIPELINE_DRAIN_TIMEOUT_SECONDS: "60"
    ports:
      - "8502:8502"
    volumes:
      - ./results:/app/results
    depends_on:
      ingestion:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      storage-consumer:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8502/_stcore/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  simulator:
    image: iot-monitoring-app:local
    profiles: ["tools"]
    entrypoint: ["python", "scripts/simulate_telemetry.py"]
    command: ["--devices", "3", "--interval", "1"]
    environment:
      INGESTION_URL: http://ingestion:8000
    depends_on:
      ingestion:
        condition: service_healthy

  load-generator:
    image: iot-monitoring-app:local
    profiles: ["tools"]
    entrypoint: ["python", "scripts/load_test.py"]
    environment:
      INGESTION_URL: http://ingestion:8000
    volumes:
      - ./results:/app/results
    depends_on:
      ingestion:
        condition: service_healthy

  benchmark-analysis:
    image: iot-monitoring-app:local
    profiles: ["tools"]
    entrypoint: ["python", "scripts/compare_benchmarks.py"]
    volumes:
      - ./results:/app/results

volumes:
  kafka_data:
  postgres_data:
